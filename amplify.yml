version: 1
frontend:
    phases:
        preBuild:
            commands:
                - 'nvm install 23'
                - 'nvm use 20'
                - 'corepack enable'
                - 'pnpm install --frozen-lockfile'
        build:
            commands:
                - 'pnpm build'
    artifacts:
        baseDirectory: .next
        files:
            - '**/*'
    cache:
        paths:
            - '.next/cache/**/*'
            - 'node_modules/**/*'
