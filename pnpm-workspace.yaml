overrides:
  # next@16.2.6 이 고정 의존하던 postcss@8.4.31 의 XSS(GHSA-qx2v-qp2m-jg93, <8.5.10)
  # 해결을 위해 트리 전체를 패치 버전으로 통일.
  # 이후 sourceMappingURL 경로 탈출로 임의 .map 파일이 노출되는
  # GHSA-r28c-9q8g-f849(<=8.5.17) 때문에 8.5.18 로 올림
  postcss: '^8.5.18'
  # esbuild GHSA: Deno 모듈 RCE(high)·Windows dev server 임의 파일 읽기(low) — <0.28.1
  esbuild: '>=0.28.1'
  # js-yaml: cosmiconfig 가 끌어오던 4.1.1 의 merge key quadratic DoS(<4.2.0) 차단 후,
  # flow collection 지수 파싱 DoS(GHSA-pm4m-ph32-ghv5, <=5.2.1) 로 5.2.2 로 올림 (dev 전용)
  js-yaml: '>=5.2.2'
  # sharp: next 가 끌어오던 0.34.5 의 libvips 상속 취약점 4건
  # (GHSA-f88m-g3jw-g9cj / CVE-2026-33327·33328·35590·35591, <0.35.0)
  sharp: '>=0.35.0'
  # fast-uri: ajv 가 끌어오던 3.1.3 의 백슬래시 authority 구분자 host confusion
  # (GHSA-v2hh-gcrm-f6hx, <=3.1.3) — dev 전용.
  # ajv@8 은 ^3.0.1 을 선언하므로 4.x 로 넘기지 않고 3.x 마지막인 3.1.4 로 한정
  'fast-uri@3': '^3.1.4'
  # brace-expansion: minimatch@3 이 끌어오던 1.1.15 의 연속 {} 그룹 지수 확장 DoS
  # (GHSA-3jxr-9vmj-r5cp, <1.1.16). minimatch@10 이 쓰는 5.x 는 대상이 아니라 1.x 만 한정
  'brace-expansion@1': '^1.1.16'
allowBuilds:
  '@tailwindcss/oxide': false
  '@vercel/speed-insights': false
  esbuild: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - '@tailwindcss/oxide'
  - '@vercel/speed-insights'
  - esbuild
  - sharp
  - unrs-resolver
